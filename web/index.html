<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<meta name="description" content="Agent 任务看板">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agent Board">
<meta name="format-detection" content="telephone=no">
<title>Agent Board</title>
<!-- api-token -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/app.css">
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search).get('theme');
    var saved = q || localStorage.getItem('ab-theme');
    var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    if (q) localStorage.setItem('ab-theme', q);
    if (dark) document.documentElement.classList.add('dark-theme');
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2.5" y="3" width="5" height="18" rx="2" fill="currentColor"/>
      <rect x="9.5" y="3" width="5" height="12" rx="2" fill="currentColor" opacity=".7"/>
      <rect x="16.5" y="3" width="5" height="15" rx="2" fill="currentColor" opacity=".44"/>
    </svg>
    <span class="brand-name">Agent Board</span>
  </div>

  <nav class="tabs" role="tablist" aria-label="视图">
    <button class="tab" role="tab" data-view="inbox">对话</button>
    <button class="tab" role="tab" data-view="board">看板</button>
    <button class="tab" role="tab" data-view="archive">归档</button>
    <button class="tab" role="tab" data-view="calendar">日历</button>
  </nav>

  <div class="topbar-right">
    <span class="live" id="live" title="实时更新"><span class="live-dot"></span><span class="live-text">实时</span></span>
    <button class="icon-btn push-off" id="pushToggle" aria-label="开启通知" title="开启通知" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
    </button>
    <button class="icon-btn" id="themeToggle" aria-label="切换深浅色" title="切换深浅色"></button>
    <button class="icon-btn" id="logoutBtn" aria-label="退出登录" title="退出登录">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h9"/></svg>
    </button>
  </div>
</header>

<main class="main">
  <section class="view" id="view-board" role="tabpanel" aria-label="看板">
    <div class="board" id="board"></div>
  </section>

  <section class="view" id="view-inbox" role="tabpanel" aria-label="对话" hidden>
    <div class="page-head">
      <div>
        <h1>对话</h1>
        <p class="page-sub">和主会话的消息，从上往下看</p>
      </div>
      <span class="count-pill" id="inboxCount">0</span>
    </div>
    <div class="pending-bar" id="pendingBar" hidden>
      <button class="pb-toggle" id="pendingToggle" aria-expanded="false" aria-controls="pendingList">
        <span class="pb-dot" aria-hidden="true"></span>
        <span class="pb-text">等你决定</span>
        <span class="pb-count" id="pendingCount">0</span>
        <svg class="pb-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pb-list" id="pendingList" hidden></div>
    </div>
    <div class="inbox" id="inbox"></div>
  </section>

  <section class="view" id="view-archive" role="tabpanel" aria-label="归档" hidden>
    <div class="page-head">
      <div>
        <h1>归档</h1>
        <p class="page-sub">收起来的旧事，可恢复或永久删除</p>
      </div>
      <span class="count-pill" id="archiveCount">0</span>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </section>

  <section class="view" id="view-calendar" role="tabpanel" aria-label="日历" hidden>
    <div class="page-head">
      <div>
        <h1>活动日历</h1>
        <p class="page-sub">最近 12 周的 Agent 事件</p>
      </div>
    </div>
    <div class="calendar-card">
      <div class="stats" id="stats"></div>
      <div class="heatmap-wrap">
        <div class="weekday-labels" aria-hidden="true"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
        <div class="heatmap-col">
          <div class="month-labels" id="monthLabels"></div>
          <div class="heatmap" id="heatmap"></div>
        </div>
      </div>
      <div class="legend"><span>少</span><i class="cell lvl-0"></i><i class="cell lvl-1"></i><i class="cell lvl-2"></i><i class="cell lvl-3"></i><i class="cell lvl-4"></i><span>多</span></div>
    </div>
    <div class="recent">
      <h2>最近活跃</h2>
      <ul id="recentDays"></ul>
    </div>
  </section>
</main>

<nav class="bottomnav" role="tablist" aria-label="主导航">
  <button class="bnav-item" role="tab" data-view="inbox">
    <span class="bnav-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V16A2.5 2.5 0 0 1 4 13.5z"/></svg>
      <span class="bnav-badge" id="navBadge" hidden>0</span>
    </span>
    <span>对话</span>
  </button>
  <button class="bnav-item" role="tab" data-view="board">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5v14M12 5v9M18.5 5v12"/></svg>
    <span>看板</span>
  </button>
  <button class="bnav-item" role="tab" data-view="calendar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.4"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M7.5 13h3M13.5 13h3M7.5 16.5h3M13.5 16.5h3"/></svg>
    <span>日历</span>
  </button>
</nav>

<dialog id="lightbox" class="lightbox" aria-label="查看图片">
  <button class="lb-close" id="lightboxClose" aria-label="关闭">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="lightboxImg" alt="">
</dialog>

<dialog id="detail" class="sheet" aria-label="任务详情">
  <div class="sheet-head">
    <button class="icon-btn back" id="sheetClose" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="task-id" id="d-id">T-1</span>
    <span class="status-pill" id="d-status">待办</span>
  </div>
  <div class="sheet-body" id="sheetBody">
    <h2 class="detail-title" id="d-title" tabindex="-1"></h2>
    <div class="detail-meta" id="d-meta"></div>
    <div class="detail-actions" id="d-actions"></div>
    <h3 class="section-title">时间线</h3>
    <ol class="timeline" id="d-timeline"></ol>
  </div>
  <div class="sheet-foot">
    <button class="btn ghost" id="dQuoteChat">回到对话并引用</button>
  </div>
</dialog>

<script src="/app.js" defer></script>
</body>
</html>
