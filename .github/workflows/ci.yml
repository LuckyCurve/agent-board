name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: web syntax
        run: |
          node --check web/app.js
          node --check web/linkify.js
          node --check web/login.js
          node --check web/sw.js
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: web test
        run: node --test web/linkify.test.mjs
      - name: build
        run: go build -o agent-board .
      # 375 宽对话页零横向溢出。ubuntu-latest 自带 Chrome。
      - name: e2e (375 对话页无横向溢出)
        run: node web/e2e/chat-overflow.mjs ./agent-board
      # 详情标题不被自动选中，但手动拖选和键盘导航都还在。
      - name: e2e (详情标题焦点与选区)
        run: node web/e2e/detail-focus.mjs ./agent-board
      # 放在最后：npm ci 会拉出 node_modules，go 的 ./... 会把它当包扫进去。
      - name: web lint
        run: |
          npm ci --no-audit --no-fund
          npx eslint web/
